<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - ချိတ်</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The page you are looking for could not be found."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/logos/favicon.ico" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/pages/404.css" />

    <!-- Google Fonts: Lexend -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Site Header -->
    <header id="navbar" class="site-header" data-component="navbar"></header>

    <main class="not-found" aria-labelledby="not-found-title">
      <div class="not-found__content">
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1 class="not-found__title" id="not-found-title">Page not found</h1>
        <p class="not-found__description">
          Sorry, we couldn’t find the page you’re looking for. It may have been
          moved or the link may be incorrect.
        </p>
        <a class="btn btn-primary" href="/">Back to home</a>
      </div>
    </main>

    <!-- Site Footer -->
    <footer id="footer" class="site-footer" data-component="footer"></footer>

    <!-- Page-Specific Script -->
    <script type="module" src="/js/pages/404.js"></script>

    <!-- Third-Party Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://kit.fontawesome.com/1c1ce0b05a.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
